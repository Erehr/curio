<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Best pictures</title>
  <link rel="stylesheet" href="/curio/ui/curio.css">
  <script src="/curio/ui/curio.js"></script>
  <script type="module" src="tab.js"></script>
  <style>
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 0.7rem; }
    .tile { border: 0; padding: 0; background: var(--grid-item); border-radius: calc(8px * var(--r)); overflow: hidden; cursor: pointer; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
    .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile.sel { outline: 2px solid var(--selection-border); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="curio-page">
    <header class="curio-page-head">
      <span class="title">Best pictures</span><span class="grow"></span>
      <select id="min">
        <option value="5">5 stars</option>
        <option value="4" selected>4 stars and up</option>
        <option value="3">3 stars and up</option>
      </select>
    </header>
    <main class="curio-page-body"><div id="grid" class="grid"></div></main>
    <footer class="curio-page-foot"><span class="grow faint" id="count"></span><span class="faint">Double-click to open in Curio's viewer</span></footer>
  </div>
</body>
</html>
